# Weekly encrypted database backup, kept as a workflow artifact for 30 days.
# Repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  direct (unpooled) Neon connection string
#   BACKUP_PASSPHRASE    long random passphrase; store it somewhere safe outside GitHub as well
# The dump is encrypted before upload because artifacts of a public repository can be downloaded by others.
name: Database backup

on:
  schedule:
    - cron: "17 21 * * 0"   # Sundays 21:17 UTC (Monday 02:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check that the secrets are configured
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "::warning::BACKUP_DATABASE_URL / BACKUP_PASSPHRASE are not set; skipping the backup."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: Dump and encrypt
        if: env.skip != '1'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PG_DUMP: docker run --rm -i --network host postgres:17 pg_dump
        run: |
          file=$(scripts/backup/backup.sh)
          echo "file=$file" >> "$GITHUB_ENV"
          ls -l "$file"
      - name: Verify the backup decrypts and lists its contents
        if: env.skip != '1'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --decrypt --passphrase-fd 3 "$file" 3<<<"$BACKUP_PASSPHRASE" \
            | docker run --rm -i postgres:17 pg_restore --list > toc.txt
          grep -c "TABLE DATA" toc.txt
      - uses: actions/upload-artifact@v7
        if: env.skip != '1'
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            sra-*.dump.gpg
            sra-*.dump.gpg.sha256
          retention-days: 30
