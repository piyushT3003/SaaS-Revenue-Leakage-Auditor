server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 30m;  # imports are capped at 25 MB by the API

  # Security headers for the single-page app. No third-party origins are used (fonts, scripts and the
  # Swagger UI are all served locally). 'unsafe-inline' styles are required by animation libraries that
  # set inline style attributes; scripts stay locked to same-origin. Canvas textures need blob:/data:.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Enable once served over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://backend:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # NB: no add_header inside location blocks: nginx would then drop every server-level security header.
  location /assets/ { expires 1y; try_files $uri =404; }   # hashed file names → long cache
  location / { expires -1; try_files $uri /index.html; }    # index.html always revalidated
}
