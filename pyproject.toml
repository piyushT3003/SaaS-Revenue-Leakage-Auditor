# Python project metadata. Used by Vercel (dependencies + entrypoint); local development and Docker use
# backend/requirements.txt, which lists the same runtime packages.
[project]
name = "saas-revenue-assurance"
version = "1.0.0"
description = "Contract-to-Cash & Customer Unit Economics Auditor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.163,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.13",
  "psycopg[binary]>=3.2.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "reportlab>=4.2",
  "httpx>=0.27",
  "sentry-sdk[fastapi]>=2.20,<3",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

# The built SPA (frontend/dist) is promoted to Vercel's CDN; vercel.json adds the same security headers
# the API middleware would, because CDN files never reach the function.
[tool.vercel.fastapi.static]
cdn = true
exclude = true
